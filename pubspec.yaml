name: flux_player
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  metadata_audio: ^0.7.2
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  vector_math: ^2.2.0
  flutter_show_menu: ^0.6.1
  path_provider: ^2.1.5
  flutter_window_close: ^1.3.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  image_path: assets/logo.png
  windows:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/
